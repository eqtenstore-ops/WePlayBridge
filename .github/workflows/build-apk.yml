name: Build APK - FIXED GRADLEW
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v4
      - name: Download official wrapper jar and fix gradlew
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WePlayBridge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
