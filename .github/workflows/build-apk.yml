name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false

      - uses: android-actions/setup-android@v4

      - name: Generate valid wrapper in empty dir
        run: |
          rm -rf gradle/wrapper/gradle-wrapper.jar gradlew
          mkdir -p /tmp/empty gradle/wrapper
          cd /tmp/empty
          gradle wrapper --gradle-version 8.7 --no-daemon
          cd $GITHUB_WORKSPACE
          cp -r /tmp/empty/gradle/wrapper/* gradle/wrapper/
          cp /tmp/empty/gradlew ./gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WePlayBridge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
